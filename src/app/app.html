<div class="app-shell">
  <app-sidebar class="sidebar" />

  <main class="main">
    @if (section() === 'diagnostics') {
      <app-bridge-diagnostics />
    } @else if (currentLibrary(); as library) {
      <app-library-view [library]="library" />
    }
  </main>

  <aside class="panel" aria-label="Ahora suena">
    <app-now-playing-panel />
  </aside>

  <section class="player" aria-label="Controles de reproducción">
    <app-player-bar />
  </section>
</div>
