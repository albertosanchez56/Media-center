<header class="view-header">
  <span class="view-icon"><app-icon [name]="library().icon" /></span>
  <div class="view-titles">
    <p class="eyebrow">Biblioteca</p>
    <h1>{{ library().name }}</h1>
  </div>
  <button type="button" class="import-button" (click)="openImport()">Importar</button>
</header>

<app-import-panel />

<div class="library-content">
  <app-empty-state
    [icon]="library().icon"
    [heading]="library().emptyTitle"
    [text]="library().emptyText"
  />
</div>
